<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 290" role="img" aria-labelledby="t d">
  <title id="t">Entanglement swapping between Alice, Charlie and Bob</title>
  <desc id="d">Alice and Bob each prepare a Bell pair and send one half to Charlie. Charlie measures the two halves and announces the outcome to both. Alice applies a Pauli correction, leaving Alice and Bob sharing an entangled pair.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#222"/>
    </marker>
    <marker id="headg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#888"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Latin Modern Roman", "CMU Serif", "STIX Two Text", Georgia, "Times New Roman", serif; font-size: 12px; fill: #222; }
    .name { font-weight: 700; font-size: 14px; }
    .m { font-style: italic; }
    .s { font-size: 8.5px; }
    .grey { fill: #777; }
    .life { stroke: #777; stroke-width: 1; stroke-dasharray: 5 4; }
    .arrow { stroke: #222; stroke-width: 1; fill: none; }
    .dots { stroke: #888; stroke-width: 1; stroke-dasharray: 1 3; stroke-linecap: round; fill: none; }
  </style>

  <!-- names -->
  <text class="name" x="70" y="18" text-anchor="middle">Alice</text>
  <text class="name" x="230" y="18" text-anchor="middle">Charlie</text>
  <text class="name" x="390" y="18" text-anchor="middle">Bob</text>

  <!-- lifelines -->
  <line class="life" x1="70" y1="28" x2="70" y2="272"/>
  <line class="life" x1="230" y1="28" x2="230" y2="272"/>
  <line class="life" x1="390" y1="28" x2="390" y2="272"/>

  <!-- preparation -->
  <text x="70" y="52" text-anchor="middle">prepares |<tspan class="m">φ</tspan><tspan class="s" dy="-5">+</tspan><tspan dy="5">⟩</tspan><tspan class="s m" dy="3">A</tspan><tspan class="s" dy="2">1</tspan><tspan class="s m" dy="-2">A</tspan><tspan class="s" dy="2">2</tspan></text>
  <text x="70" y="70" text-anchor="middle">retains <tspan class="m">A</tspan><tspan class="s" dy="2">1</tspan></text>
  <text x="390" y="52" text-anchor="middle">prepares |<tspan class="m">φ</tspan><tspan class="s" dy="-5">+</tspan><tspan dy="5">⟩</tspan><tspan class="s m" dy="3">B</tspan><tspan class="s" dy="2">1</tspan><tspan class="s m" dy="-2">B</tspan><tspan class="s" dy="2">2</tspan></text>
  <text x="390" y="70" text-anchor="middle">retains <tspan class="m">B</tspan><tspan class="s" dy="2">1</tspan></text>

  <!-- halves sent to Charlie -->
  <line class="arrow" x1="70" y1="106" x2="230" y2="106" marker-end="url(#head)"/>
  <text x="150" y="97" text-anchor="middle"><tspan class="m">A</tspan><tspan class="s" dy="2">2</tspan></text>
  <line class="arrow" x1="390" y1="134" x2="230" y2="134" marker-end="url(#head)"/>
  <text x="310" y="125" text-anchor="middle"><tspan class="m">B</tspan><tspan class="s" dy="2">2</tspan></text>

  <!-- Charlie measures and announces -->
  <text x="230" y="160" text-anchor="middle">measures (<tspan class="m">A</tspan><tspan class="s" dy="2">2</tspan><tspan dy="-2">, </tspan><tspan class="m">B</tspan><tspan class="s" dy="2">2</tspan><tspan dy="-2">)</tspan></text>
  <text x="230" y="177" text-anchor="middle">announces (<tspan class="m">m</tspan><tspan class="s" dy="2">1</tspan><tspan dy="-2">, </tspan><tspan class="m">m</tspan><tspan class="s" dy="2">2</tspan><tspan dy="-2">)</tspan></text>

  <!-- announcement to both -->
  <line class="arrow" x1="70" y1="206" x2="390" y2="206" marker-start="url(#head)" marker-end="url(#head)"/>
  <text x="140" y="197" text-anchor="middle">(<tspan class="m">m</tspan><tspan class="s" dy="2">1</tspan><tspan dy="-2">, </tspan><tspan class="m">m</tspan><tspan class="s" dy="2">2</tspan><tspan dy="-2">)</tspan></text>
  <text x="320" y="197" text-anchor="middle">(<tspan class="m">m</tspan><tspan class="s" dy="2">1</tspan><tspan dy="-2">, </tspan><tspan class="m">m</tspan><tspan class="s" dy="2">2</tspan><tspan dy="-2">)</tspan></text>

  <!-- outcome -->
  <text x="70" y="254" text-anchor="middle">applies <tspan class="m">P</tspan><tspan class="s" dy="2">m</tspan><tspan dy="-2"> to </tspan><tspan class="m">A</tspan><tspan class="s" dy="2">1</tspan></text>
  <text x="390" y="254" text-anchor="middle">holds <tspan class="m">B</tspan><tspan class="s" dy="2">1</tspan></text>
  <line class="dots" x1="150" y1="250" x2="168" y2="250" marker-start="url(#headg)"/>
  <text class="grey" x="230" y="254" text-anchor="middle">shared pair <tspan class="m">ρ</tspan><tspan class="s" dy="2">A</tspan><tspan class="s" dy="0">1</tspan><tspan class="s m" dy="0">B</tspan><tspan class="s" dy="0">1</tspan></text>
  <line class="dots" x1="292" y1="250" x2="312" y2="250" marker-end="url(#headg)"/>
</svg>
